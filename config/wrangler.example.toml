# Example Wrangler config for The Leverage Lab Cloudflare Worker.
# Copy to cloudflare-worker/wrangler.toml and fill secrets via `wrangler secret put`.
# Do NOT commit cloudflare-worker/wrangler.toml (see root .gitignore).
# IDs from config/teable-manifest.json (2026-08-31).

name = "the-leverage-lab-api"
main = "src/index.ts"
compatibility_date = "2025-02-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "development"
API_BASE_URL = "https://api.theleveragelab.com"
ALLOWED_ORIGINS = "chrome-extension://YOUR_EXTENSION_ID,https://lab.theleveragelab.com,https://app.theleveragelab.com"
LAB_DASHBOARD_URL = "https://lab.theleveragelab.com"
DEFAULT_TIMEZONE = "America/Los_Angeles"
DASHFORM_FORM_ID = "nr0HMXaCSM"
DASHFORM_FORM_UUID = "5d3e962a-bc3a-41c3-b88b-afbfb45aab78"
DASHFORM_ORGANIZATION_ID = "fe655e99-f58f-4cd9-a135-b4f423a33b47"

TEABLE_API_BASE_URL = "https://app.teable.ai/api"
TEABLE_MASTER_BASE_ID = "bsepxFqD62xkJPeEU8O"
TEABLE_TEMPLATE_FOLDER_ID = "bnfOKrLgZQSoxtvLXxf"
# REQUIRED before onboarding can provision client bases
TEABLE_SPACE_ID = "PENDING_TEABLE_SPACE_ID"

TEABLE_EXECUTIVE_DIRECTORY_TABLE_ID = "tblKx1CqkYTqfwaYC3M"
TEABLE_PROVISIONING_LOG_TABLE_ID = "tbldvmRTNyzYa4dlMXR"
TEABLE_MASTER_PROMPT_TEMPLATES_TABLE_ID = "tblZbo1aLF9OfMRDLYu"
